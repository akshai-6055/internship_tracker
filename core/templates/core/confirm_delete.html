{% extends 'base.html' %}

{% block title %}Confirm Deletion | InternVault{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-6">
        <div class="glass-card p-5 text-center">
            <div class="mb-4">
                <div class="bg-danger bg-opacity-10 d-inline-block p-4 rounded-circle mb-3">
                    <i class="fas fa-exclamation-triangle text-danger fa-3x"></i>
                </div>
                <h2 class="fw-bold">Confirm Deletion</h2>
                <p class="text-secondary fs-5 mt-3">
                    Are you sure you want to permanently remove <br>
                    <span class="text-white fw-bold">"{{ object }}"</span>?
                </p>
                <div class="alert alert-danger bg-opacity-10 border-danger border-opacity-25 text-danger small mt-4">
                    <i class="fas fa-info-circle me-2"></i>This action cannot be undone and will remove all associated data.
                </div>
            </div>

            <form method="post" class="mt-5">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url url %}" class="btn btn-outline-light px-5 py-2">
                        <i class="fas fa-arrow-left me-2"></i>Keep it
                    </a>
                    <button type="submit" class="btn btn-danger px-5 py-2 shadow-lg">
                        <i class="fas fa-trash-alt me-2"></i>Delete Permanently
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
