{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 text-center">
            <div class="card-body p-5">
                <h3 class="text-danger mb-3">Delete Account</h3>
                <p class="text-muted mb-4">Warning: This action is irreversible. All your data will be permanently removed.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% if user.is_admin %}{% url 'admin_dashboard' %}{% else %}{% url 'student_dashboard' %}{% endif %}" class="btn btn-secondary me-2 px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete My Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
